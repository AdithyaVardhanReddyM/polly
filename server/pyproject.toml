[project]
name = "polly-server"
version = "0.1.0"
description = "Polly's agent server — hosts the agents, their memory, tools and computers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "langchain>=1.4",
    "langgraph>=1.2",
    "deepagents>=0.7",
    "langchain-nebius>=0.1",
    "langchain-tavily>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "beautifulsoup4>=4.15.0",
    "composio>=0.22.0",
    "composio-langchain>=0.25.0",
    # Nebius ConTree sandboxes: where agents run code.
    "contree-sdk[langchain]>=0.3.6",
    # Or NVIDIA OpenShell sandboxes, behind a network policy (`POLLY_SANDBOX=openshell`).
    "openshell>=0.1.2",
    # Knowledge bases: reading PDFs (and rendering scanned pages), Word and
    # Excel files and images, and taking uploads.
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    # Vector search in SQLite, next to FTS5 keyword search (`retrieval.py`).
    "sqlite-vec>=0.1.9",
]

[project.scripts]
polly-server = "polly_server.__main__:main"
polly-check = "polly_server.check:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polly_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
