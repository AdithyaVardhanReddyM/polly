[project]
name = "polly-server"
version = "0.1.0"
description = "Polly's agent server — hosts the agents, their memory, tools and computers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "langchain>=1.4",
    "langgraph>=1.2",
    "deepagents>=0.7",
    "langchain-nebius>=0.1",
    "langchain-tavily>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "beautifulsoup4>=4.15.0",
    "composio>=0.22.0",
    "composio-langchain>=0.25.0",
    # Nebius ConTree sandboxes: where agents run code.
    "contree-sdk[langchain]>=0.3.6",
    "croniter>=6.2.4",
]

[project.scripts]
polly-server = "polly_server.__main__:main"
polly-check = "polly_server.check:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polly_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
